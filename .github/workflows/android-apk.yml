name: Build AlteraVie Android APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Optional public HTTPS URL of the AlteraVie FastAPI backend (leave blank to build the APK without hosted API features)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Configure optional backend URL
        shell: bash
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
        run: |
          if [[ -n "$BACKEND_URL" ]]; then
            if [[ "$BACKEND_URL" != https://* ]]; then
              echo "::error::If supplied, the backend URL must start with https://"
              exit 1
            fi
            echo "VITE_API_BASE=${BACKEND_URL%/}" >> "$GITHUB_ENV"
          else
            echo "VITE_API_BASE=" >> "$GITHUB_ENV"
            echo "Building without a hosted backend URL. Features requiring the API may not work until a backend is hosted."
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract prepared AlteraVie source
        shell: bash
        run: |
          test -f altandroid_free_android_ready.zip || {
            echo "::error::Expected altandroid_free_android_ready.zip in repository root."
            exit 1
          }
          mkdir source
          unzip -q altandroid_free_android_ready.zip -d source
          test -f source/altandroid/frontend/package.json || {
            echo "::error::Prepared archive does not contain altandroid/frontend/package.json."
            exit 1
          }
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source/altandroid" >> "$GITHUB_ENV"
          find source -type f \( -name '.env' -o -name '.env.*' \) -delete

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/altandroid/frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          # sdkmanager may close stdin after accepting all licenses; tolerate yes receiving SIGPIPE.
          yes | "$SDKMANAGER" --licenses >/tmp/android-sdk-licenses.log 2>&1 || {
            if ! grep -qi "all sdk package licenses accepted\|licenses accepted" /tmp/android-sdk-licenses.log; then
              cat /tmp/android-sdk-licenses.log
              exit 1
            fi
          }
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install frontend dependencies
        working-directory: source/altandroid/frontend
        run: npm install --no-audit --no-fund

      - name: Prepare AlteraVie launcher icon
        working-directory: source/altandroid/frontend
        run: |
          npm install --no-save --no-audit --no-fund sharp @capacitor/assets
          mkdir -p assets
          cp "$GITHUB_WORKSPACE/android-assets/alteravie-icon.svg" assets/alteravie-icon.svg
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          const source = 'assets/alteravie-icon.svg';
          await sharp(source).resize(1024, 1024).png().toFile('assets/icon-only.png');
          await sharp(source).resize(1024, 1024).png().toFile('assets/splash.png');
          NODE

      - name: Build frontend
        working-directory: source/altandroid/frontend
        env:
          VITE_API_BASE: ${{ inputs.backend_url }}
        run: npm run build

      - name: Install Capacitor TypeScript support
        working-directory: source/altandroid/frontend
        run: npm install --no-save --no-audit --no-fund typescript@5.7.3

      - name: Generate Android project and branded icons
        working-directory: source/altandroid/frontend
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK
        working-directory: source/altandroid/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlteraVie-Android-debug-apk
          path: source/altandroid/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as a public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAG="apk-v${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            source/altandroid/frontend/android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$REPOSITORY" \
            --title "AlteraVie Android APK $TAG" \
            --notes "Installable AlteraVie Android APK built by GitHub Actions. Backend-dependent features require a reachable API server."
